name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # --ignore-scripts: @n8n/node-cli pulls in native modules it does not use to build or lint.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
